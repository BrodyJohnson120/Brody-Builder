<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b22">
    <title>Hello, Brody — Constellations</title>
    <style>
      :root {
        color: #f6f4ff;
        background: #050b22;
        font-family: Georgia, "Times New Roman", serif;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        place-items: center;
        background:
          radial-gradient(circle at 50% 46%, rgb(38 53 115 / 34%), transparent 35rem),
          radial-gradient(circle at 8% 4%, #172654 0, transparent 26rem),
          linear-gradient(145deg, #040919 0%, #070e2a 52%, #020614 100%);
      }

      .sky {
        position: relative;
        width: min(94vw, 1120px);
        padding: clamp(2.5rem, 8vw, 6.5rem) 1rem;
        isolation: isolate;
      }

      .stars, .stars::before, .stars::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image:
          radial-gradient(circle, #fff 0 1px, transparent 1.7px),
          radial-gradient(circle, rgb(180 207 255 / 90%) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgb(255 239 174 / 95%) 0 1.4px, transparent 2px);
        background-position: 4% 18%, 78% 26%, 91% 73%;
        background-size: 143px 177px, 211px 229px, 319px 271px;
        content: "";
        opacity: .9;
      }

      .stars::before { transform: rotate(19deg) scale(1.1); opacity: .6; }
      .stars::after { transform: rotate(-12deg) scale(.87); opacity: .45; }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #a8b9e9;
        font-family: "Trebuchet MS", sans-serif;
        font-size: clamp(.66rem, 1.5vw, .82rem);
        font-weight: 700;
        letter-spacing: .25em;
        text-align: center;
        text-transform: uppercase;
      }

      h1 { margin: 0; }

      svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .constellation-word {
        fill: url(#constellation-stars);
        filter: url(#glow);
      }

      .subtitle {
        margin: 1.65rem 0 0;
        color: #c9d5ff;
        font-family: "Trebuchet MS", sans-serif;
        font-size: clamp(.9rem, 2vw, 1.1rem);
        letter-spacing: .08em;
        text-align: center;
      }

      .subtitle span { color: #fff0ab; }

      @media (max-width: 560px) {
        .sky { padding-inline: 0; }
        .eyebrow { margin-bottom: .75rem; }
      }
    </style>
  </head>
  <body>
    <main class="sky">
      <div class="stars" aria-hidden="true"></div>
      <p class="eyebrow">A message written in the stars</p>
      <h1>
        <svg viewBox="0 0 1100 250" role="img" aria-labelledby="constellation-title constellation-description">
          <title id="constellation-title">Hello, Brody written in star constellations</title>
          <desc id="constellation-description">The greeting Hello, Brody is formed from bright stars and fine constellation lines against a night sky.</desc>
          <defs>
            <filter id="glow" x="-20%" y="-35%" width="140%" height="170%">
              <feGaussianBlur stdDeviation="2.3" result="softGlow" />
              <feMerge><feMergeNode in="softGlow" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <pattern id="constellation-stars" width="42" height="34" patternUnits="userSpaceOnUse">
              <path d="M4 7 20 16 36 5M20 16 31 29M4 7 10 27 31 29" fill="none" stroke="#9db6fa" stroke-width=".85" opacity=".75" />
              <circle cx="4" cy="7" r="2.7" fill="#fff9d6" />
              <circle cx="20" cy="16" r="2.2" fill="#dce8ff" />
              <circle cx="36" cy="5" r="1.8" fill="#fff" />
              <circle cx="10" cy="27" r="1.7" fill="#dce8ff" />
              <circle cx="31" cy="29" r="2.5" fill="#fff9d6" />
              <circle cx="4" cy="7" r="5.5" fill="none" stroke="#fff3ae" stroke-width=".65" opacity=".65" />
            </pattern>
          </defs>
          <text class="constellation-word" x="550" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="159" font-weight="bold" letter-spacing="-5">Hello, Brody</text>
        </svg>
      </h1>
      <p class="subtitle">Look up — <span>your constellation is shining.</span></p>
    </main>
  </body>
</html>
