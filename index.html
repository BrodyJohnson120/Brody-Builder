<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, Brody</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color: #f7f7ff;
        background: #090916;
        font-family: "DM Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #5d3fd3 0, transparent 28rem),
          radial-gradient(circle at 82% 76%, #f04e98 0, transparent 26rem),
          linear-gradient(135deg, #0b0b1d 20%, #171044 55%, #0a1235);
      }

      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        width: 20rem;
        height: 20rem;
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 50%;
        content: "";
      }

      body::before {
        top: -8rem;
        right: -5rem;
        box-shadow: 0 0 7rem #7c57ff;
      }

      body::after {
        bottom: -10rem;
        left: -7rem;
        box-shadow: 0 0 8rem #ff66b2;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(90vw, 56rem);
        padding: clamp(2rem, 8vw, 6rem);
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 1.5rem;
        background: rgb(10 10 31 / 58%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 35%);
        text-align: center;
        backdrop-filter: blur(16px);
      }

      p {
        margin: 0 0 1.25rem;
        color: #bfc2ff;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(3.25rem, 11vw, 8.5rem);
        letter-spacing: -0.08em;
        line-height: 0.9;
        text-wrap: balance;
      }

      h1 span {
        color: #c6b6ff;
        text-shadow: 0 0 2rem rgb(165 134 255 / 60%);
      }
    </style>
  </head>
  <body>
    <main>
      <p>A bright hello from the digital cosmos</p>
      <h1>Hello, <span>Brody</span></h1>
    </main>
  </body>
</html>
